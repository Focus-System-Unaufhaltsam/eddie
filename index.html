<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EDDIE | FOCUS SYSTEM</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --brand-color: #7C3AED; /* STRIKTE BRAND FARBE: PURPLE */
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text-main: #343536;
      --success: #0f9d58;
      --danger: #c92a2a;
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background:var(--bg); color:var(--text-main); min-height:100vh; padding:20px 14px 40px; overflow-x:hidden; }
    .wrap { width:100%; max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .title h1 { font-size:clamp(24px, 5vw, 42px); line-height:1; font-weight:900; letter-spacing:-0.8px; text-transform: uppercase;}
    .btn { appearance:none; border:none; background:#343536; color:#fff; padding:16px 22px; border-radius:14px; font-weight: 900; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; transition:transform .12s ease; text-transform: uppercase; }
    .btn:active { transform:scale(.98); }
    .btn-brand { background: var(--brand-color); color: #fff; }
    .hud { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
    .stat { border:2px solid #000; border-radius:18px; padding:12px; background:#fff; text-align:center; }
    .stat .label { font-size:10px; opacity:.6; text-transform:uppercase; font-weight:800; margin-bottom:4px; }
    .stat .value { font-size:clamp(18px, 4vw, 28px); font-weight:900; line-height:1; color: var(--brand-color); }
    .game-shell { position:relative; width:100%; background:#fff; border:2px solid #000; border-radius:24px; overflow:hidden; }
    canvas { display:block; width:100%; height:auto; background: radial-gradient(circle, #fff 0%, #eee 100%); touch-action: none; }
    .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(52, 53, 54, 0.95); text-align:center; z-index:100; backdrop-filter: blur(5px); color: #fff; }
    .overlay.hidden { display:none; }
    .card { width:min(100%, 480px); background:#fff; border: 2px solid #000; border-top: 4px solid var(--brand-color); border-radius: 4px; padding:30px 20px; color: #000; }
    .card h2 { font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
    .leaderboard-container { background:#fff; border:2px solid #000; border-radius:22px; padding:20px; margin-top:10px; color: #000; }
    .leaderboard-title { font-weight:900; text-transform:uppercase; margin-bottom:10px; border-bottom:2px solid #000; padding-bottom:5px; }
    .leaderboard-entry { display:flex; justify-content:space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-weight:700; list-style:none; font-size: 15px; }
    .leaderboard-entry .rank-name { display: flex; gap: 10px; align-items: center; }
    .leaderboard-entry .rank-number { font-weight: 900; color: var(--brand-color); min-width: 25px; }
    #nameInput { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; font-size: 15px; text-align: center; font-weight: bold; outline: none; text-transform: uppercase; }
    #errorMsg { color: var(--danger); font-size: 11px; font-weight: 900; margin-bottom: 10px; display: none; text-transform: uppercase; }
    @media (max-width:720px){ .btn { width:100%; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div class="title"><h1>EDDIE UNAUFHALTSAM</h1></div>
      <button class="btn" id="resetBtn">RESET</button>
    </div>
    <section class="hud">
      <div class="stat"><div class="label">Boxes</div><div class="value" id="boxValue">2</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="bestValue">0</div></div>
    </section>
    <section class="game-shell">
      <canvas id="gameCanvas" width="960" height="540"></canvas>
      <div class="overlay" id="startOverlay">
        <div class="card">
          <h2>EDDIE'S WORLD</h2>
          <p>The star is the dog. The focus is you. Reach Level 30.</p>
          <button class="btn btn-brand" id="startBtn" style="margin-top:20px; width:100%;">START SYSTEM</button>
        </div>
      </div>
      <div class="overlay hidden" id="gameOverOverlay">
        <div class="card">
          <h2 style="color:var(--danger)">SYSTEM FAILED</h2>
          <p id="aiText" style="font-size:13px; font-weight:bold; font-style:italic; margin:15px 0; color:#555;"></p>
          <div id="finalScore" style="font-size:60px; font-weight:900; margin:10px 0; color: #000;">0 BOXES</div>
          <p id="finalTime" style="font-size:16px; font-weight:900; color:var(--brand-color); margin-bottom:20px;">TIME: 0.00s</p>
          
          <div id="leaderboardEntrySection" style="display:none; margin-bottom: 20px; padding-top: 15px; border-top: 2px solid #000;">
            <p style="font-size:12px; font-weight:900; margin-bottom:10px; text-transform:uppercase; color:#000;">Secure your spot in the ranking:</p>
            <div id="errorMsg"></div>
            <input type="text" id="nameInput" placeholder="YOUR NAME" maxlength="15" />
            <button class="btn btn-brand" id="saveScoreBtn" style="width:100%; margin-bottom: 10px;">SAVE RANK</button>
          </div>
          
          <button class="btn" id="restartBtn" style="width:100%;">REBOOT</button>
        </div>
      </div>
    </section>
    <section class="leaderboard-container">
      <div style="font-weight:900; margin-bottom:8px; color:var(--danger);">30 BOXES: NOBODY</div>
      <div class="leaderboard-title">Eddie's Elite Ranking</div>
      <div id="leaderboardList"></div>
    </section>
  </main>

  <script>
    const CONFIG = { id: "leaderboard_eddie", minScore: 1, maxScore: 29 };
    const firebaseConfig = {
      apiKey: "AIzaSyC0olKESyTP0rXUlnjGstLlGN50I1m_O2A",
      authDomain: "mg-challenge.firebaseapp.com",
      projectId: "mg-challenge",
      storageBucket: "mg-challenge.firebasestorage.app",
      messagingSenderId: "472289048663",
      appId: "1:472289048663:web:cc68ded6007e1e822c4b12"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const dbRef = db.collection(CONFIG.id);

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const BEST_KEY = "best_" + CONFIG.id;

    let state = { running: false, score: 0, startTime: 0, totalTime: 0, phase: "idle", phaseStartedAt: 0, boxes: [], correctId: null, selectedId: null, swapsRemaining: 0, activeSwap: null };

    function buildRound() {
      if (state.score >= CONFIG.maxScore) { finish(true); return; }
      state.boxes = []; state.selectedId = null; state.activeSwap = null;
      const count = Math.min(30, 2 + state.score);
      const cols = Math.ceil(Math.sqrt(count));
      const boxW = Math.max(45, Math.min(92, (canvas.width - 160) / cols - 24));
      const gridW = cols * boxW + (cols - 1) * 24;
      const startX = (canvas.width - gridW) / 2;
      const startY = 160 + ((canvas.height - 200) - (Math.ceil(count / cols) * boxW + (Math.ceil(count / cols) - 1) * 24)) / 2;
      for (let i = 0; i < count; i++) {
        state.boxes.push({ id: i, x: startX + (i % cols) * (boxW + 24), y: startY + Math.floor(i / cols) * (boxW + 24), w: boxW, h: boxW, lift: 0 });
      }
      state.correctId = Math.floor(Math.random() * count);
      state.swapsRemaining = Math.max(4, 3 + Math.floor(count * 1.5));
      setPhase("show");
      updateHud();
    }

    function startNextSwap() {
      if (state.swapsRemaining <= 0) { state.activeSwap = null; setPhase("wait"); return; }
      let a = state.boxes.findIndex(b => b.id === state.correctId), b = Math.floor(Math.random() * state.boxes.length);
      while (b === a) b = Math.floor(Math.random() * state.boxes.length);
      state.activeSwap = { aId: state.boxes[a].id, bId: state.boxes[b].id, aStartX: state.boxes[a].x, bStartX: state.boxes[b].x, aStartY: state.boxes[a].y, bStartY: state.boxes[b].y, aTargetX: state.boxes[b].x, bTargetX: state.boxes[a].x, aTargetY: state.boxes[b].y, bTargetY: state.boxes[a].y, start: performance.now(), duration: Math.max(140, (2200 - state.score * 90) / 7.5) };
      state.swapsRemaining--;
    }

    function update(ts) {
      if (!state.running) return;
      if (state.phase === "show" && ts - state.phaseStartedAt > 1400) { setPhase("shuffle"); startNextSwap(); }
      else if (state.phase === "shuffle") {
        if (!state.activeSwap) { startNextSwap(); return; }
        const s = state.activeSwap, p = Math.min(1, (ts - s.start) / s.duration), e = p < 0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
        const bA = state.boxes.find(b => b.id === s.aId), bB = state.boxes.find(b => b.id === s.bId);
        if(bA && bB) { bA.x = s.aStartX + (s.aTargetX - s.aStartX) * e; bB.x = s.bStartX + (s.bTargetX - s.bStartX) * e; bA.y = s.aStartY + (s.aTargetY - s.aStartY) * e; bB.y = s.bStartY + (s.bTargetY - s.bStartY) * e; if (p >= 1) state.activeSwap = null; }
      } else if (state.phase === "wait" && ts - state.phaseStartedAt > 300) setPhase("pick");
      else if (state.phase === "reveal" && ts - state.phaseStartedAt > 1200) { if (state.selectedId === state.correctId) { state.score++; buildRound(); } else finish(false); }
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      state.boxes.forEach(box => {
        ctx.strokeStyle = "#000"; ctx.lineWidth = 3; ctx.strokeRect(box.x, box.y, box.w, box.h);
        if (state.phase === "show" && box.id === state.correctId) { ctx.fillStyle = "#7C3AED"; ctx.fillRect(box.x, box.y, box.w, box.h); }
      });
    }

    function finish(victory) {
      state.running = false; state.totalTime = (performance.now() - state.startTime) / 1000;
      document.getElementById("gameOverOverlay").classList.remove("hidden");
      document.getElementById("finalScore").textContent = (state.score + 2) + " BOXES";
      document.getElementById("finalTime").textContent = `TIME: ${state.totalTime.toFixed(2)}s`;
      if (state.score >= CONFIG.minScore) document.getElementById("leaderboardEntrySection").style.display = "block";
    }

    function setPhase(p) { state.phase = p; state.phaseStartedAt = performance.now(); }
    function updateHud() { 
      const best = localStorage.getItem(BEST_KEY) || 0;
      document.getElementById("boxValue").textContent = state.score + 2;
      document.getElementById("bestValue").textContent = parseInt(best) + 2;
    }

    canvas.onmousedown = e => { const r = canvas.getBoundingClientRect(); handleInteraction((e.clientX - r.left)*(canvas.width/r.width), (e.clientY - r.top)*(canvas.height/r.height)); };
    function handleInteraction(x, y) { if (state.phase === "pick") { state.boxes.forEach(b => { if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { state.selectedId = b.id; setPhase("reveal"); } }); } }

    document.getElementById("startBtn").onclick = () => { state.running = true; state.startTime = performance.now(); document.getElementById("startOverlay").classList.add("hidden"); buildRound(); };
    document.getElementById("restartBtn").onclick = () => location.reload();

    document.getElementById("saveScoreBtn").onclick = async () => {
      const name = document.getElementById("nameInput").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!name) return;
      await dbRef.doc(name).set({ name, score: state.score + 2, time: state.totalTime, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
      if (state.score > (localStorage.getItem(BEST_KEY) || 0)) localStorage.setItem(BEST_KEY, state.score);
      location.reload();
    };

    auth.onAuthStateChanged(user => { if (user) { dbRef.onSnapshot(snap => {
      let entries = []; snap.forEach(d => entries.push(d.data()));
      entries.sort((a, b) => b.score - a.score || a.time - b.time);
      const list = document.getElementById("leaderboardList"); list.innerHTML = "";
      entries.slice(0, 10).forEach((data, i) => {
        list.innerHTML += `<li class="leaderboard-entry"><div class="rank-name"><span class="rank-number">#${i+1}</span><span>${data.name}</span></div><span>${data.score} BOXES</span></li>`;
      });
    }); } });
    auth.signInAnonymously();

    function loop(ts) { update(ts); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
